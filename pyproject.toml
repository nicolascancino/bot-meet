[project]
name = "botmeet"
version = "0.1.0"
description = "Floating meeting recorder: capture, transcribe locally, generate visual notes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "soundcard>=0.4",
    "PySide6>=6.7",
    "pynput>=1.7",
]

[project.scripts]
botmeet = "botmeet.cli:main"

[project.optional-dependencies]
transcribe-cuda = ["faster-whisper>=1.0", "av>=19", "scipy>=1.14", "nvidia-cublas-cu12"]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botmeet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
